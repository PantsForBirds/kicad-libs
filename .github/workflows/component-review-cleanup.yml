# Removes a PR's preview (pr/<N>/ on gh-pages) when the PR is closed or merged.
# pull_request_target runs this file from the base branch; no PR code is checked out, only
# kipr at the pinned commit runs. Off when CR_PUBLISH is 'false' (same switch as publish).
name: Component review (cleanup)

on:
  pull_request_target:
    types: [closed]
    paths:   # same as component-review.yml
      - "lib_fp/**"
      - "lib_sch/**"
      - "lib_3d/**"
      - ".github/workflows/component-review.yml"

permissions: {}

jobs:
  cleanup:
    if: vars.CR_PUBLISH != 'false'
    permissions:
      contents: write        # push to gh-pages
      pull-requests: write   # note on the sticky comment
    uses: CoolNamesAllTaken/kipr/.github/workflows/library-review-cleanup.yml@2d2a0078eb3beafb652e884623e15574130d9e82
    with:
      kipr-ref: 2d2a0078eb3beafb652e884623e15574130d9e82
