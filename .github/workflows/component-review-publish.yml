# Component review: Pages preview + sticky PR comment + "Component review" check (privileged).
#
# Triggered when "Component review" finishes. workflow_run always runs this file from the
# DEFAULT BRANCH, so a PR can't change it (or the kipr ref below) before it is merged. The PR's
# code is never checked out or run here: only kipr, installed at the pinned commit. The PR run's
# artifacts are treated as untrusted data (see kipr's library-review-publish.yml).
# On by default; set the repository variable CR_PUBLISH=false to turn this and the cleanup off.
name: Component review (publish)

on:
  workflow_run:
    workflows: ["Component review"]
    types: [completed]

permissions: {}

jobs:
  publish:
    if: vars.CR_PUBLISH != 'false'
    permissions:
      contents: write        # push the preview to gh-pages
      pull-requests: write   # sticky comment + inline review
      checks: write          # "Component review" check run
      actions: read          # download the artifacts of the triggering run
    uses: CoolNamesAllTaken/kipr/.github/workflows/library-review-publish.yml@476e5354c61f0cf7460d3600cc0bed9975c5397b
    with:
      kipr-ref: 476e5354c61f0cf7460d3600cc0bed9975c5397b
      klc: ${{ vars.CR_KLC != 'false' }}
      # F7.2 "Pad '1' not located at origin": our footprint origins are at the part centroid
      # (pick-and-place), THT parts included. Keep the same value in both component-review files.
      klc-ignore: F7.2
      pages-url: ${{ vars.CR_PAGES_URL }}
      fail-conclusion: ${{ vars.CR_FAIL_CONCLUSION || 'neutral' }}
