# Component review (unprivileged, artifacts only): renders the changed footprints, symbols and
# 3D models, runs the deterministic checks (KLC-style rules + the official KLC checker) and
# uploads the artifacts component-review.html (opens in the browser), component-review-site
# (viewer zip) and component-review-data. It runs code from the PR, so it gets a read-only
# token and no secrets. All the work is done by kipr's reusable workflow; see
# https://github.com/CoolNamesAllTaken/kipr/blob/main/docs/library.md
# Keep the `uses:` ref and kipr-ref on the same commit, here and in the other two
# component-review-*.yml files.
name: Component review   # component-review-publish.yml triggers on this name

on:
  pull_request:
    paths:
      - "lib_fp/**"
      - "lib_sch/**"
      - "lib_3d/**"
      - ".github/workflows/component-review.yml"

permissions:
  contents: read

concurrency:
  group: component-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    uses: CoolNamesAllTaken/kipr/.github/workflows/library-review.yml@b9735ae92d85daa194931a4d15976f064f37f45f
    with:
      kipr-ref: b9735ae92d85daa194931a4d15976f064f37f45f
      kicad-image: ${{ vars.CR_KICAD_IMAGE || 'kicad/kicad:10.0' }}
      fetch-stock-models: ${{ vars.CR_FETCH_STOCK_MODELS != 'false' }}
      klc: ${{ vars.CR_KLC != 'false' }}
